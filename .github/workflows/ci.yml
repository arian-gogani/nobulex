name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The build runs before the tests on purpose. vitest.config.ci.ts aliases
      # the merged-into-core packages straight at packages/core/src, so a test
      # run resolves imports the published build never sees. That is useful for
      # tests and it is why a broken build shipped green: packages/core was
      # importing @nobulex/crypto, which is not in this repository, and every
      # test passed because the alias rewrote it. tsc has no aliases.
      - run: npm run build

      - run: npx vitest run --config vitest.config.ci.ts

      # examples/README.md calls these runnable and tells a reader to run them
      # with exactly this command. Twelve of twenty ran. Whatever the README
      # claims about them is now checked on every push.
      # An exit code is not enough here, and this step used to trust one.
      # Fifteen of these examples ended in `main().catch(console.error)`, which
      # prints the failure and then exits 0, so 02-delegation-chain and
      # 06-multi-party-audit threw a TypeError on every run and were counted as
      # passing. That is the failure this whole repository is about: a well
      # formed success that validates perfectly. The examples now exit non-zero,
      # and this step also reads stderr, so neither half has to be right alone.
      - name: Examples run as documented
        run: |
          failed=""
          for f in examples/*.ts; do
            timeout 120 npx tsx "$f" > /dev/null 2>/tmp/ex.err
            rc=$?
            if [ $rc -ne 0 ]; then
              failed="$failed $f(exit $rc)"
            elif grep -qE "TypeError|ReferenceError|SyntaxError|^Error:" /tmp/ex.err; then
              failed="$failed $f(exit 0, threw)"
            fi
          done
          if [ -n "$failed" ]; then
            echo "examples that did not run clean:$failed"
            for f in $failed; do
              n=${f%%(*}
              echo "--- $n"; npx tsx "$n" 2>&1 >/dev/null | tail -5
            done
            exit 1
          fi
          echo "all $(ls examples/*.ts | wc -l) examples ran clean"

  # packages/typescript publishes as the unscoped name `nobulex`, which is the
  # name a reader types, and it was in no workspace and no CI. It did not
  # compile: tsconfig set no rootDir and pulled no node types, so `npm run
  # build` failed and test.js could not find ./dist at all.
  unscoped-package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/typescript
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npm run build

      - run: node test.js

      - run: node test-action-ref-normalization.js

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd packages/python
          pip install -e ".[dev]" pytest flask langchain-core

      - name: Run tests
        run: |
          cd packages/python
          PYTHONPATH=. pytest -v
