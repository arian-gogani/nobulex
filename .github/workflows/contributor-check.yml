name: Contributor Check

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  contributor-check:
    runs-on: ubuntu-latest
    steps:
      - name: Run AGT Contributor Check
        uses: microsoft/agent-governance-toolkit/.github/actions/contributor-check@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          checks: "profile,credential,cluster"
          risk-threshold: "MEDIUM"
