name: Release

# Publishes packages when a version tag is pushed, e.g.:
#   git tag v1.0.1 && git push --tags
#
# Both jobs use OIDC "trusted publishing" — GitHub mints a short-lived
# identity token per run, so NO long-lived npm or PyPI tokens are stored
# in this repo. One-time setup on each registry (see bottom of this file).

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to release
        required: true
        default: all
        type: choice
        options:
          - all
          - core
          - langchain
          - sdk
          - python
  push:
    tags:
      - 'v*'

jobs:
  npm:
    if: github.event_name != 'workflow_dispatch' || inputs.package == 'all' || inputs.package == 'core'
    name: Publish @nobulex/core to npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for npm OIDC trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # npm >= 11.5.1 performs OIDC trusted publishing automatically (npm@11 is Node 20/24 compatible)
      - run: npm install -g npm@11

      - run: npm ci

      - name: Build core
        run: npm run build -w packages/core

      - name: Publish (skip if version already on npm)
        run: |
          LOCAL=$(node -p "require('./packages/core/package.json').version")
          if npm view "@nobulex/core@$LOCAL" version >/dev/null 2>&1; then
            echo "@nobulex/core@$LOCAL already published, skipping."
          else
            npm publish -w packages/core --provenance --access public
          fi

  npm-langchain:
    if: github.event_name != 'workflow_dispatch' || inputs.package == 'all' || inputs.package == 'langchain'
    name: Publish @nobulex/langchain to npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run build -w packages/core
      - run: npm run build -w packages/langchain

      - name: Publish (skip if version already on npm)
        run: |
          LOCAL=$(node -p "require('./packages/langchain/package.json').version")
          if npm view "@nobulex/langchain@$LOCAL" version >/dev/null 2>&1; then
            echo "@nobulex/langchain@$LOCAL already published, skipping."
          else
            npm publish -w packages/langchain --provenance --access public
          fi

  npm-sdk:
    if: github.event_name != 'workflow_dispatch' || inputs.package == 'all' || inputs.package == 'sdk'
    name: Publish @nobulex/sdk to npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run build -w packages/core
      - run: npm run build -w packages/sdk

      - name: Publish (skip if version already on npm)
        run: |
          LOCAL=$(node -p "require('./packages/sdk/package.json').version")
          if npm view "@nobulex/sdk@$LOCAL" version >/dev/null 2>&1; then
            echo "@nobulex/sdk@$LOCAL already published, skipping."
          else
            npm publish -w packages/sdk --provenance --access public
          fi

  pypi:
    if: github.event_name != 'workflow_dispatch' || inputs.package == 'all' || inputs.package == 'python'
    name: Publish nobulex to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for PyPI OIDC trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build sdist and wheel
        run: |
          cd packages/python
          python -m pip install --upgrade build
          python -m build

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/dist
          skip-existing: true

# ---------------------------------------------------------------------------
# One-time trusted-publisher setup (done once by the repo owner, no tokens):
#
# npm  → npmjs.com → each of @nobulex/core, @nobulex/langchain, and
#        @nobulex/sdk → Settings → Trusted publishing → add:
#          Repository:  arian-gogani/nobulex
#          Workflow:    release.yml
#          Environment: (leave blank)
#
# PyPI → pypi.org → Your projects → nobulex → Settings → Publishing →
#        Add a "pending" or existing trusted publisher:
#          Owner:            arian-gogani
#          Repository name:  nobulex
#          Workflow name:    release.yml
#          Environment:      (leave blank)
#
# After that, cutting a release is just:
#   npm version patch -w packages/core   # or bump pyproject.toml
#   git tag v1.0.1 && git push --tags
# ---------------------------------------------------------------------------
