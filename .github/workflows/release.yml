name: Release

# Publishes packages when a version tag is pushed, e.g.:
#   git tag v1.0.1 && git push --tags
#
# Both jobs use OIDC "trusted publishing" — GitHub mints a short-lived
# identity token per run, so NO long-lived npm or PyPI tokens are stored
# in this repo. One-time setup on each registry (see bottom of this file).

on:
  push:
    tags:
      - 'v*'

jobs:
  npm:
    name: Publish @nobulex/core to npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for npm OIDC trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # npm >= 11.5.1 performs OIDC trusted publishing automatically (npm@11 is Node 20/24 compatible)
      - run: npm install -g npm@11

      - run: npm ci

      - name: Build core
        run: npm run build -w packages/core

      - name: Publish (skip if version already on npm)
        run: |
          LOCAL=$(node -p "require('./packages/core/package.json').version")
          REMOTE=$(npm view @nobulex/core version 2>/dev/null || echo none)
          if [ "$LOCAL" = "$REMOTE" ]; then
            echo "@nobulex/core@$LOCAL already published — skipping."
          else
            npm publish -w packages/core --provenance --access public
          fi

  pypi:
    name: Publish nobulex to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for PyPI OIDC trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build sdist and wheel
        run: |
          cd packages/python
          python -m pip install --upgrade build
          python -m build

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/dist
          skip-existing: true

# ---------------------------------------------------------------------------
# One-time trusted-publisher setup (done once by the repo owner, no tokens):
#
# npm  → npmjs.com → @nobulex/core → Settings → Trusted publishing → add:
#          Repository:  arian-gogani/nobulex
#          Workflow:    release.yml
#          Environment: (leave blank)
#
# PyPI → pypi.org → Your projects → nobulex → Settings → Publishing →
#        Add a "pending" or existing trusted publisher:
#          Owner:            arian-gogani
#          Repository name:  nobulex
#          Workflow name:    release.yml
#          Environment:      (leave blank)
#
# After that, cutting a release is just:
#   npm version patch -w packages/core   # or bump pyproject.toml
#   git tag v1.0.1 && git push --tags
# ---------------------------------------------------------------------------
