<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Nobulex - The accountability primitive for AI agents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0b"/>
      <stop offset="1" stop-color="#15151b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="5" fill="url(#accent)"/>
  <text x="80" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="82" font-weight="800" fill="#f5f5f7" letter-spacing="-3">nobulex</text>
  <text x="84" y="192" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="31" font-weight="500" fill="#c8c8d0">The accountability primitive for AI agents</text>
  <text x="84" y="234" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#8a8a93">signed receipts for every agent action. verify offline, trust no operator.</text>
  <text x="84" y="278" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#22c55e">pip install nobulex   /   npm i @nobulex/core   /   MIT</text>
  <g opacity="0.16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#6366f1">
    <text x="880" y="120">action_ref = SHA-256(JCS({</text>
    <text x="900" y="144">  agent_id, action_type,</text>
    <text x="900" y="168">  scope, timestamp_ms }))</text>
    <text x="880" y="200">admission then outcome</text>
    <text x="880" y="224">Ed25519 / RFC 8785</text>
  </g>
</svg>
