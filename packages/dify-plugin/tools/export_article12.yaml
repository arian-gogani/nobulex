identity:
  name: export_article12
  author: arian-gogani
  label:
    en_US: Export Article 12 Package
description:
  human:
    en_US: "Export signed session records and technical context for an EU AI Act Article 12 review. This is evidence, not a compliance determination."
  llm: "Export signed session records, a chain head hash, and technical context for an Article 12 review. Do not describe the output as proof of compliance."
parameters:
  - name: session_id
    type: string
    required: false
    label:
      en_US: Session ID
    human_description:
      en_US: "Identifier for this Dify workflow session. Defaults to the current session."
    llm_description: "Optional session identifier. If omitted, exports the current session."
    form: form
  - name: include_policy_mapping
    type: boolean
    required: false
    default: true
    label:
      en_US: Include Policy Mapping
    human_description:
      en_US: "Include technical context about Article 12 logging capabilities. Default: true."
    form: form
output:
  type: object
  properties:
    package_json:
      type: string
      description: "Full evidence package as JSON. Contains signed receipts, chain head hash, and obligation mapping."
    receipt_count:
      type: integer
      description: "Number of receipts in this session."
    chain_head_hash:
      type: string
      description: "SHA-256 of the last receipt. An auditor walks back from here."

extra:
  python:
    source: tools/export_article12.py
