identity:
  name: verify_receipt
  author: arian-gogani
  label:
    en_US: Verify Receipt
description:
  human:
    en_US: "Verify that a receipt's Ed25519 signature is valid and that the hash chain is intact. Returns true/false and the reason for any failure."
  llm: "Verify a nobulex receipt is cryptographically valid. Pass the receipt_json from sign_receipt."
parameters:
  - name: receipt_json
    type: string
    required: true
    label:
      en_US: Receipt JSON
    human_description:
      en_US: "The full receipt JSON string returned by sign_receipt."
    llm_description: "The receipt JSON string to verify. Comes from sign_receipt's receipt_json output."
    form: llm
output:
  type: object
  properties:
    valid:
      type: boolean
      description: "True if the signature is valid and the receipt is unmodified."
    reason:
      type: string
      description: "If valid is false, explains what failed (signature_invalid, chain_break, malformed)."