[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nobulex"
version = "0.1.0"
description = "Trust Capital for AI agents. Tamper-proof receipts for everything your AI agent does."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "Arian Gogani", email = "nobulex.dev@gmail.com"}]
keywords = ["ai", "agents", "trust", "accountability", "receipts", "verification"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "cryptography>=41.0",
]

[project.urls]
Homepage = "https://nobulex.com"
Repository = "https://github.com/arian-gogani/nobulex"
Documentation = "https://nobulex.com/docs"

[tool.setuptools.packages.find]
where = ["."]
include = ["nobulex*"]
